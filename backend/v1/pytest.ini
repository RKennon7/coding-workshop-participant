[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# one event loop for the whole run: the app's engine is module-level, and asyncpg connections are tied to a loop
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore:There is no current event loop:DeprecationWarning:mangum
